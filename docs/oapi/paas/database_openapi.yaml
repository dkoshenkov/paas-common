openapi: 3.0.3
info:
  title: "database API"
  version: "1.0.0"
paths:
  "/apps/database/credentials":
    post:
      operationId: "DatabaseCredentials"
      requestBody:
        required: true
        x-flux-max-bytes: 1048576
        x-flux-allow-empty: false
        x-flux-object-only: true
        x-flux-unknown-fields: reject
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DatabaseCredentialsRequest"
      responses:
        "200":
          description: "HTTP 200 response"
          headers:
            Set-Cookie:
              description: Cookie header; multiple cookies are sent as separate Set-Cookie fields.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatabaseCredentialsResponse"
        "400":
          description: "HTTP 400 response"
          headers:
            Set-Cookie:
              description: Cookie header; multiple cookies are sent as separate Set-Cookie fields.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
        "404":
          description: "HTTP 404 response"
          headers:
            Set-Cookie:
              description: Cookie header; multiple cookies are sent as separate Set-Cookie fields.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
        "409":
          description: "HTTP 409 response"
          headers:
            Set-Cookie:
              description: Cookie header; multiple cookies are sent as separate Set-Cookie fields.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
        "413":
          description: "HTTP 413 response"
          headers:
            Set-Cookie:
              description: Cookie header; multiple cookies are sent as separate Set-Cookie fields.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
        "503":
          description: "HTTP 503 response"
          headers:
            Set-Cookie:
              description: Cookie header; multiple cookies are sent as separate Set-Cookie fields.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
components:
  schemas:
    DatabaseCredentialsRequest:
      type: object
      required:
        - "app_id"
        - "purpose"
      properties:
        app_id:
          type: string
        purpose:
          type: string
    DatabaseCredentialsResponse:
      type: object
      required:
        - "app_id"
        - "database"
        - "host"
        - "password"
        - "port"
        - "purpose"
        - "username"
      properties:
        app_id:
          type: string
        database:
          type: string
        host:
          type: string
        password:
          type: string
        port:
          type: integer
        purpose:
          type: string
        username:
          type: string
    TypesDiagnostic:
      type: object
      required:
        - "code"
        - "message"
        - "severity"
      properties:
        code:
          type: string
        column:
          type: integer
        document:
          type: integer
        field_path:
          type: string
        file:
          type: string
        line:
          type: integer
        message:
          type: string
        severity:
          type: string
    TypesErrorResponse:
      type: object
      required:
        - "code"
        - "diagnostics"
        - "message"
      properties:
        code:
          type: string
        conflicting_operation_id:
          type: string
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/TypesDiagnostic"
        message:
          type: string
