openapi: 3.0.3
info:
  title: "apps API"
  version: "1.0.0"
paths:
  "/apps/get":
    get:
      operationId: "AppsGet"
      parameters:
        - name: "app_id"
          in: query
          required: true
          allowEmptyValue: true
          schema:
            type: string
      responses:
        "200":
          description: "HTTP 200 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogTypesAppSummary"
        "400":
          description: "HTTP 400 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
        "404":
          description: "HTTP 404 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
        "503":
          description: "HTTP 503 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
  "/apps/list":
    get:
      operationId: "AppsList"
      parameters:
        - name: "cursor"
          in: query
          required: false
          allowEmptyValue: true
          schema:
            type: string
        - name: "limit"
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: "HTTP 200 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogTypesAppPage"
        "400":
          description: "HTTP 400 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
        "503":
          description: "HTTP 503 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
components:
  schemas:
    CatalogTypesAppPage:
      type: object
      required:
        - "items"
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogTypesAppSummary"
        next_cursor:
          type: string
    CatalogTypesAppSummary:
      type: object
      required:
        - "app_id"
        - "name"
      properties:
        app_id:
          type: string
        name:
          type: string
    TypesDiagnostic:
      type: object
      required:
        - "code"
        - "message"
        - "severity"
      properties:
        code:
          type: string
        column:
          type: integer
        document:
          type: integer
        field_path:
          type: string
        file:
          type: string
        line:
          type: integer
        message:
          type: string
        severity:
          type: string
    TypesErrorResponse:
      type: object
      required:
        - "code"
        - "diagnostics"
        - "message"
      properties:
        code:
          type: string
        conflicting_operation_id:
          type: string
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/TypesDiagnostic"
        message:
          type: string
