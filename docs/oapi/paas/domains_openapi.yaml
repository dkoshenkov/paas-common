openapi: 3.0.3
info:
  title: "domains API"
  version: "1.0.0"
paths:
  "/apps/domains":
    get:
      operationId: "DomainsList"
      parameters:
        - name: "app_id"
          in: query
          required: true
          allowEmptyValue: true
          schema:
            type: string
      responses:
        "200":
          description: "HTTP 200 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainsTypesDomainsSnapshot"
        "400":
          description: "HTTP 400 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
        "404":
          description: "HTTP 404 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
        "503":
          description: "HTTP 503 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
  "/apps/domains/register":
    post:
      operationId: "DomainsRegister"
      requestBody:
        required: true
        x-flux-max-bytes: 1048576
        x-flux-allow-empty: false
        x-flux-object-only: true
        x-flux-unknown-fields: reject
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainsTypesDomainRequest"
      responses:
        "200":
          description: "HTTP 200 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainsTypesDomainSnapshot"
        "201":
          description: "HTTP 201 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainsTypesDomainSnapshot"
        "400":
          description: "HTTP 400 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
        "404":
          description: "HTTP 404 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
        "409":
          description: "HTTP 409 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
        "413":
          description: "HTTP 413 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
        "503":
          description: "HTTP 503 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
  "/apps/domains/remove":
    post:
      operationId: "DomainsRemove"
      requestBody:
        required: true
        x-flux-max-bytes: 1048576
        x-flux-allow-empty: false
        x-flux-object-only: true
        x-flux-unknown-fields: reject
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DomainsTypesDomainRequest"
      responses:
        "200":
          description: "HTTP 200 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DomainsTypesDomainSnapshot"
        "400":
          description: "HTTP 400 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
        "404":
          description: "HTTP 404 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
        "409":
          description: "HTTP 409 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
        "413":
          description: "HTTP 413 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
        "503":
          description: "HTTP 503 response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypesErrorResponse"
components:
  schemas:
    DomainsTypesDomainRequest:
      type: object
      required:
        - "app_id"
        - "domain"
      properties:
        app_id:
          type: string
        domain:
          type: string
    DomainsTypesDomainSnapshot:
      type: object
      required:
        - "app_id"
        - "domain"
      properties:
        app_id:
          type: string
        domain:
          type: string
    DomainsTypesDomainsSnapshot:
      type: object
      required:
        - "app_id"
        - "domains"
      properties:
        app_id:
          type: string
        domains:
          type: array
          items:
            type: string
        tls_profile:
          type: string
    TypesDiagnostic:
      type: object
      required:
        - "code"
        - "message"
        - "severity"
      properties:
        code:
          type: string
        column:
          type: integer
        document:
          type: integer
        field_path:
          type: string
        file:
          type: string
        line:
          type: integer
        message:
          type: string
        severity:
          type: string
    TypesErrorResponse:
      type: object
      required:
        - "code"
        - "diagnostics"
        - "message"
      properties:
        code:
          type: string
        conflicting_operation_id:
          type: string
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/TypesDiagnostic"
        message:
          type: string
