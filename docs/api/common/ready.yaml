services:
  ready:
    proto:
      package: paas.common.ready.v1
      go_package: github.com/dkoshenkov/paas/pkg/sdk/common/grpc/ready
    endpoints:
      - name: Ready
        method: GET
        path: /ready
        responses:
          "200": ReadyResponse


types:
  ReadyResponse:
    kind: struct
    fields:
      status: {type: string, number: 1}
