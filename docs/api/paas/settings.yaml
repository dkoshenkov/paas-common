services:
  settings:
    endpoints:
      - name: CreateApp
        method: POST
        path: /apps/create
        body:
          type: ./settings_types.yaml#CreateAppRequest
          maxBytes: 1048576
          objectOnly: true
          unknownFields: reject
        responses:
          "200": ./catalog_types.yaml#AppSummary
          "201": ./catalog_types.yaml#AppSummary
          "400": ./types.yaml#ErrorResponse
          "409": ./types.yaml#ErrorResponse
          "413": ./types.yaml#ErrorResponse
          "503": ./types.yaml#ErrorResponse
      - name: CreateComponent
        method: POST
        path: /components/create
        body:
          type: ./settings_types.yaml#CreateComponentRequest
          maxBytes: 1048576
          objectOnly: true
          unknownFields: reject
        responses:
          "200": ./catalog_types.yaml#ComponentSummary
          "201": ./catalog_types.yaml#ComponentSummary
          "400": ./types.yaml#ErrorResponse
          "404": ./types.yaml#ErrorResponse
          "409": ./types.yaml#ErrorResponse
          "413": ./types.yaml#ErrorResponse
          "503": ./types.yaml#ErrorResponse
      - name: ComponentPolicy
        method: GET
        path: /components/policy
        parameters:
          - name: app_id
            field: appId
            in: query
            type: string
            required: true
          - name: component_id
            field: componentId
            in: query
            type: string
            required: true
        responses:
          "200": ./settings_types.yaml#ComponentPolicyObservedSnapshot
          "400": ./types.yaml#ErrorResponse
          "404": ./types.yaml#ErrorResponse
          "503": ./types.yaml#ErrorResponse
      - name: SetComponentPolicy
        method: POST
        path: /components/set-policy
        body:
          type: ./settings_types.yaml#SetPolicyRequest
          maxBytes: 1048576
          objectOnly: true
          unknownFields: reject
        responses:
          "200": ./settings_types.yaml#ComponentPolicySnapshot
          "400": ./types.yaml#ErrorResponse
          "404": ./types.yaml#ErrorResponse
          "409": ./types.yaml#ErrorResponse
          "413": ./types.yaml#ErrorResponse
          "503": ./types.yaml#ErrorResponse
      - name: AppMigrator
        method: GET
        path: /apps/migrator
        parameters:
          - name: app_id
            field: appId
            in: query
            type: string
            required: true
        responses:
          "200": ./settings_types.yaml#MigratorSnapshot
          "400": ./types.yaml#ErrorResponse
          "404": ./types.yaml#ErrorResponse
          "503": ./types.yaml#ErrorResponse
      - name: SetAppMigrator
        method: POST
        path: /apps/set-migrator
        body:
          type: ./settings_types.yaml#SetMigratorRequest
          maxBytes: 1048576
          objectOnly: true
          unknownFields: reject
        responses:
          "200": ./settings_types.yaml#MigratorSnapshot
          "400": ./types.yaml#ErrorResponse
          "404": ./types.yaml#ErrorResponse
          "409": ./types.yaml#ErrorResponse
          "413": ./types.yaml#ErrorResponse
          "503": ./types.yaml#ErrorResponse
      - name: RemoveAppMigrator
        method: POST
        path: /apps/remove-migrator
        body:
          type: ./settings_types.yaml#RemoveMigratorRequest
          maxBytes: 1048576
          objectOnly: true
          unknownFields: reject
        responses:
          "200": ./settings_types.yaml#MigratorSnapshot
          "400": ./types.yaml#ErrorResponse
          "404": ./types.yaml#ErrorResponse
          "409": ./types.yaml#ErrorResponse
          "413": ./types.yaml#ErrorResponse
          "503": ./types.yaml#ErrorResponse
