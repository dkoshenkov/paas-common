services:
  deployments:
    endpoints:
      - name: Preview
        method: POST
        path: /deployments/preview
        body:
          type: ./types.yaml#PreviewRequest
          maxBytes: 8388608
          objectOnly: true
          unknownFields: reject
        responses:
          "200": ./types.yaml#PreviewResponse
          "400": ./types.yaml#ErrorResponse
          "404": ./types.yaml#ErrorResponse
          "413": ./types.yaml#ErrorResponse
          "503": ./types.yaml#ErrorResponse
      - name: Apply
        method: POST
        path: /deployments/apply
        body:
          type: ./types.yaml#ApplyRequest
          maxBytes: 8388608
          objectOnly: true
          unknownFields: reject
        responses:
          "200": ./types.yaml#Operation
          "202": ./types.yaml#Operation
          "400": ./types.yaml#ErrorResponse
          "404": ./types.yaml#ErrorResponse
          "409": ./types.yaml#ErrorResponse
          "410": ./types.yaml#ErrorResponse
          "413": ./types.yaml#ErrorResponse
          "503": ./types.yaml#ErrorResponse
