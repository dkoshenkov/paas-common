name: go-quality

on:
  workflow_call:
    inputs:
      go-version-file:
        required: false
        type: string
        default: go.mod

      golangci-lint-version:
        required: false
        type: string
        default: v2.11

permissions:
  contents: read

jobs:
  go-mod-tidy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Check go mod tidy
        run: go mod tidy -diff

  go-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Run tests
        run: go test -count=1 ./...

  go-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Build packages
        run: go build ./...

  go-race:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Run race detector
        run: go test -race ./...

  govulncheck:
    runs-on: ubuntu-latest

    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: ${{ inputs.go-version-file }}
          go-package: ./...

  go-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Run go vet
        run: go vet ./...

  golangci-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ inputs.go-version-file }}

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-lint-version }}
          install-only: true

      - name: Check formatting
        run: |
          golangci-lint fmt
          git diff --exit-code

      - name: Run golangci-lint
        run: golangci-lint run
