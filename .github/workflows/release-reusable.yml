name: release

on:
  workflow_call:
    inputs:
      config-file:
        required: false
        type: string
        default: configs/release-please-config.json

      manifest-file:
        required: false
        type: string
        default: configs/.release-please-manifest.json

    secrets:
      token:
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest

    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}
