name: codeql

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '30 1 * * 0'

concurrency:
  group: codeql
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

jobs:
  detect-go:
    runs-on: ubuntu-latest

    outputs:
      has_go: ${{ steps.detect.outputs.has_go }}

    steps:
      - uses: actions/checkout@v6

      - id: detect
        name: Detect Go source files
        run: |
          go_file="$(find . -type f -name '*.go' -not -path './.git/*' -not -path './vendor/*' -print -quit)"
          if [[ -n "$go_file" ]]; then
            echo 'has_go=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_go=false' >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: detect-go
    if: needs.detect-go.outputs.has_go == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: autobuild

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
