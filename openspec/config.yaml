schema: spec-driven

context: |
  Пиши артефакты на русском, кратко и технически.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Корень этого OpenSpec — репозиторий paas-common внутри workspace paas.
  В workspace три отдельных Git-репозитория: paas-common, paas-ctl и paas-daemon.
  Общие changes находятся здесь; пути в соседние проекты считаются от workspace.
  paas-common содержит Go SDK; исходные API-контракты находятся в docs/api.
  pkg/http, pkg/grpc, docs/proto и docs/oapi внутри paas-common генерируются;
  не редактируй их вручную. paas-ctl и paas-daemon пока содержат шаблоны.
  Следуй AGENTS.md и принципам ponytail: минимальные изменения,
  существующие решения и стандартная библиотека прежде новых зависимостей.
  Все архитектурные решения требуют явного одобрения пользователя.
  Git доступен только для чтения без разрешения пользователя.
  Для каждого commit, push и создания PR/MR требуется отдельное разрешение.

rules:
  proposal:
    - Явно указывай затронутые репозитории, цель и границы изменения.
  design:
    - Отделяй предложенные решения от явно одобренных пользователем.
  tasks:
    - Разбивай работу на небольшие проверяемые этапы.
    - Перед реализацией архитектуры предусматривай её согласование.

operations:
  apply:
    guidance:
      - Не реализуй несогласованные архитектурные решения.
      - Выполняй только согласованный объём текущего этапа.
